<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Fluid Music Visualizer</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .picker {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(6, 7, 10, 0.86);
        backdrop-filter: blur(14px);
        z-index: 10;
        transition: opacity 0.25s ease;
      }
      .picker.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .picker.dropping .picker-inner {
        border-color: #6ee7ff;
      }
      .picker-inner {
        width: min(520px, calc(100vw - 32px));
        padding: 28px;
        border: 1px solid #23262c;
        border-radius: 16px;
        background: #0d0f13;
        text-align: center;
      }
      .picker h1 {
        margin: 0 0 6px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #f2f4f7;
      }
      .hint {
        margin: 0 0 18px;
        font-size: 13px;
        color: #9aa3ad;
      }
      .hint.dim {
        color: #666d76;
      }
      .tracks {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
      }
      .track,
      .browse {
        width: 100%;
        padding: 10px 12px;
        border-radius: 9px;
        border: 1px solid #262a31;
        background: #14171c;
        color: #e8ebef;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .browse {
        text-align: center;
        background: #1d4ed8;
        border-color: #1d4ed8;
      }
      .track:hover {
        background: #1b1f25;
      }
      .browse:hover {
        background: #2563eb;
      }
      .status {
        margin: 14px 0 0;
        min-height: 16px;
        font-size: 12px;
        color: #9aa3ad;
      }
      .status.error {
        color: #ff7a7a;
      }
      .keys {
        position: fixed;
        left: 12px;
        top: 12px;
        font-size: 11px;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.34);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: none;
        z-index: 4;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div class="keys">space play/pause · D analysis · O open · ←/→ seek</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
