<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Fluid Music Visualizer</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .picker {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(6, 7, 10, 0.86);
        backdrop-filter: blur(14px);
        z-index: 10;
        transition: opacity 0.25s ease;
      }
      .picker.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .picker.dropping .picker-inner {
        border-color: #6ee7ff;
      }
      .picker-inner {
        width: min(520px, calc(100vw - 32px));
        padding: 28px;
        border: 1px solid #23262c;
        border-radius: 16px;
        background: #0d0f13;
        text-align: center;
      }
      .picker h1 {
        margin: 0 0 6px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #f2f4f7;
      }
      .hint {
        margin: 0 0 18px;
        font-size: 13px;
        color: #9aa3ad;
      }
      .hint.dim {
        color: #666d76;
      }
      .tracks {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
      }
      .track,
      .browse {
        width: 100%;
        padding: 10px 12px;
        border-radius: 9px;
        border: 1px solid #262a31;
        background: #14171c;
        color: #e8ebef;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .browse {
        text-align: center;
        background: #1d4ed8;
        border-color: #1d4ed8;
      }
      .track:hover {
        background: #1b1f25;
      }
      .browse:hover {
        background: #2563eb;
      }
      .status {
        margin: 14px 0 0;
        min-height: 16px;
        font-size: 12px;
        color: #9aa3ad;
      }
      .status.error {
        color: #ff7a7a;
      }
      .transport {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 6;
        background: linear-gradient(to top, rgba(6, 7, 10, 0.92), rgba(6, 7, 10, 0));
        padding: 22px 14px 10px;
        color: #d8dde3;
        font-size: 12px;
        transition: opacity 0.4s ease, transform 0.4s ease;
      }
      /* The transport, the key hints and the simulation panel fade together, driven by one
         timer on <body>. Hiding only the transport left the other two floating over the
         picture, which is the thing they are all meant to get out of the way of. */
      body.ui-idle .transport {
        opacity: 0;
        transform: translateY(10px);
        pointer-events: none;
      }
      body.ui-idle .keys,
      body.ui-idle .lil-gui.root {
        opacity: 0;
        pointer-events: none;
      }

      .tp-scrub {
        position: relative;
        height: 16px;
        cursor: pointer;
        margin-bottom: 8px;
      }
      .tp-sections,
      .tp-played {
        position: absolute;
        left: 0;
        right: 0;
        top: 6px;
        height: 5px;
        border-radius: 3px;
        overflow: hidden;
      }
      .tp-sections {
        background: rgba(255, 255, 255, 0.12);
      }
      /* Section spans, coloured by the atmosphere each was assigned. */
      .tp-sec {
        position: absolute;
        top: 0;
        bottom: 0;
        opacity: 0.75;
        border-right: 1px solid rgba(0, 0, 0, 0.55);
      }
      /* Dims what has NOT played yet. Overlaying the played part instead washed the
         section colours out, which are the whole point of the bar. */
      .tp-played {
        left: auto;
        right: 0;
        background: rgba(6, 7, 10, 0.62);
        pointer-events: none;
      }
      .tp-head {
        position: absolute;
        top: 2px;
        width: 2px;
        height: 13px;
        margin-left: -1px;
        background: #fff;
        border-radius: 1px;
        pointer-events: none;
        box-shadow: 0 0 6px rgba(255, 255, 255, 0.7);
      }
      .tp-scrub:hover .tp-sections,
      .tp-scrub:hover .tp-played {
        top: 4px;
        height: 9px;
      }

      .tp-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .tp-btn {
        border: 1px solid #2a2f37;
        background: #14171c;
        color: #e8ebef;
        border-radius: 7px;
        padding: 5px 11px;
        font: inherit;
        cursor: pointer;
        line-height: 1.2;
      }
      .tp-btn:hover {
        background: #1d222a;
      }
      .tp-play {
        min-width: 38px;
      }
      .tp-time {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #9aa3ad;
        font-variant-numeric: tabular-nums;
      }
      .tp-title {
        max-width: 26ch;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #aeb6bf;
      }
      .tp-spacer {
        flex: 1;
      }
      .tp-badge {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: #7f8894;
        border: 1px solid #23272e;
        border-radius: 6px;
        padding: 3px 7px;
        white-space: nowrap;
      }
      .tp-field {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: #7f8894;
        font-size: 11px;
      }
      .tp-field select {
        background: #14171c;
        color: #e8ebef;
        border: 1px solid #2a2f37;
        border-radius: 6px;
        padding: 4px 6px;
        font: inherit;
        font-size: 11px;
      }
      .tp-vol input {
        width: 70px;
        accent-color: #6ea8ff;
      }

      @media (max-width: 720px) {
        .tp-title,
        .tp-vol {
          display: none;
        }
      }

      .exportp {
        position: fixed;
        inset: 0;
        z-index: 12;
        display: grid;
        place-items: center;
        background: rgba(4, 5, 8, 0.72);
        backdrop-filter: blur(10px);
      }
      .exportp.hidden {
        display: none;
      }
      .ep-inner {
        width: min(560px, calc(100vw - 28px));
        max-height: calc(100vh - 48px);
        overflow: auto;
        background: #0d0f13;
        border: 1px solid #23262c;
        border-radius: 16px;
        padding: 20px;
        color: #d8dde3;
        font-size: 13px;
      }
      .ep-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .ep-head h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }
      .ep-close {
        background: none;
        border: none;
        color: #8b939d;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        padding: 0 4px;
      }
      .ep-card {
        border: 1px solid #1e2228;
        border-radius: 11px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .ep-card h3 {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ep-tag {
        font-size: 10px;
        font-weight: 500;
        padding: 2px 7px;
        border-radius: 20px;
        letter-spacing: 0.02em;
      }
      .ep-good {
        background: #12331f;
        color: #6ee39a;
      }
      .ep-warn {
        background: #3a2a12;
        color: #f0b866;
      }
      .ep-card p {
        margin: 0 0 12px;
        color: #8b939d;
        font-size: 12px;
        line-height: 1.5;
      }
      .ep-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 9px;
        margin-bottom: 12px;
      }
      .ep-grid label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 11px;
        color: #7f8894;
      }
      .ep-grid select {
        background: #14171c;
        color: #e8ebef;
        border: 1px solid #2a2f37;
        border-radius: 7px;
        padding: 6px;
        font: inherit;
        font-size: 12px;
      }
      .ep-actions {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .ep-btn {
        border: 1px solid #2a2f37;
        background: #14171c;
        color: #e8ebef;
        border-radius: 8px;
        padding: 8px 14px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .ep-btn:hover:not(:disabled) {
        background: #1d222a;
      }
      .ep-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .ep-primary {
        background: #1d4ed8;
        border-color: #1d4ed8;
      }
      .ep-primary:hover:not(:disabled) {
        background: #2563eb;
      }
      .ep-recording {
        background: #7f1d1d;
        border-color: #7f1d1d;
      }
      .ep-rec-status {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: #9aa3ad;
      }
      .ep-progress {
        margin-top: 12px;
      }
      .ep-bar {
        height: 5px;
        border-radius: 3px;
        background: #1b1f25;
        overflow: hidden;
      }
      .ep-fill {
        height: 100%;
        width: 0;
        background: #6ea8ff;
        transition: width 0.2s linear;
      }
      .ep-status {
        margin: 7px 0 0;
        font-size: 11px;
        color: #9aa3ad;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .ep-note {
        margin: 0;
        font-size: 11px;
        color: #f0b866;
        line-height: 1.5;
      }

      .keys {
        position: fixed;
        left: 12px;
        top: 12px;
        font-size: 11px;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.34);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: none;
        z-index: 4;
      }
      .keys,
      .lil-gui.root {
        transition: opacity 0.4s ease;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div class="keys">space play/pause · D analysis · E export · C clear · drag to splat</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
